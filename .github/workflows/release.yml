name: Release

# Publishes a version when its tag is pushed:
#   git tag -a v0.11.0 -m "Release v0.11.0" && git push origin v0.11.0
# Runs the full CI first, checks that the tag matches __version__, builds,
# publishes to PyPI (trusted publishing: no token stored on GitHub) and
# creates the GitHub release with the CHANGELOG notes and the packages.
# PyPI attestations (PEP 740, Sigstore) are generated by pypi-publish with
# trusted publishing. Actions are pinned by commit SHA; Dependabot updates them.
#
# Run it by hand (Actions > Release > Run workflow, or
# `gh workflow run release.yml`) to check the PyPI trusted publisher setup
# without publishing anything: it only asks PyPI for an upload token.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-trusted-publishing:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Same environment and workflow file as publish-pypi: PyPI checks both.
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Exchange the GitHub OIDC token for a PyPI upload token (nothing is uploaded)
        run: |
          audience=$(curl -fsS https://pypi.org/_/oidc/audience | jq -r .audience)
          oidc=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience" | jq -r .value)
          response=$(curl -sS -X POST https://pypi.org/_/oidc/mint-token \
            -H "Content-Type: application/json" -d "{\"token\": \"$oidc\"}")
          # Never print the response on success: it holds the (short-lived) upload token.
          if echo "$response" | jq -e '.token' >/dev/null 2>&1; then
            echo "Trusted publishing is set up: PyPI accepted this workflow."
          else
            echo "PyPI refused the token exchange:"
            echo "$response" | jq '.errors // .'
            exit 1
          fi

  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('faker_grocery/__init__.py').read()).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ $version"; exit 1
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "No CHANGELOG section for $version"; exit 1; }
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Check the wheel ships the catalog
        run: unzip -l dist/*.whl | grep -q "faker_grocery/data/grocery_data.json.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/faker-grocery/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found && !/^---$/ {print}
          ' CHANGELOG.md > notes.md
          printf '\nInstall: `pip install faker-grocery==%s` - https://pypi.org/project/faker-grocery/%s/\n' \
            "$version" "$version" >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag dist/*
