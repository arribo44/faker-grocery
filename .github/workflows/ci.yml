name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        faker-version: ["latest"]
        include:
          # Oldest supported Faker, to catch breakage of the private
          # Generator.__config locale lookup (see _generator_locale).
          - python-version: "3.10"
            faker-version: "20.0.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - if: matrix.faker-version != 'latest'
        run: pip install "faker==${{ matrix.faker-version }}"
      - run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Check the wheel ships the catalog
        run: unzip -l dist/*.whl | grep -q "faker_grocery/data/grocery_data.json"
