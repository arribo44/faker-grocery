name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Also run by release.yml before publishing a tagged version.
  workflow_call:

# Read-only token by default; jobs needing more ask for it explicitly.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: Type check (package + documented typed usage)
        run: mypy faker_grocery tests/test_typing.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        faker-version: ["latest"]
        include:
          # Oldest supported Faker, to catch breakage of the private
          # Generator.__config locale lookup (see _generator_locale).
          - python-version: "3.11"
            faker-version: "20.0.0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - if: matrix.faker-version != 'latest'
        run: pip install "faker==${{ matrix.faker-version }}"
      - run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Check the wheel ships the catalog
        run: unzip -l dist/*.whl | grep -q "faker_grocery/data/grocery_data.json.gz"

  audit:
    # Known vulnerabilities in the installed dependencies (Faker and its own).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - run: pip install . pip-audit
      - run: pip-audit --skip-editable
