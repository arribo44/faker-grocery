name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Also run by release.yml before publishing a tagged version.
  workflow_call:

# Read-only token by default; jobs needing more ask for it explicitly.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: Type check (package + documented typed usage)
        run: mypy faker_grocery tests/test_typing.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        faker-version: ["latest"]
        include:
          # Oldest supported Faker, to catch breakage of the private
          # Generator.__config locale lookup (see _generator_locale).
          - python-version: "3.11"
            faker-version: "20.0.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test,data]"
      - if: matrix.faker-version != 'latest'
        run: pip install "faker==${{ matrix.faker-version }}"
      - run: pytest -q

  test-minimal:
    # Without pandas / pyarrow: the package itself must not need them, and
    # the DataFrame / Parquet tests must skip cleanly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Check the wheel ships the catalog
        run: unzip -l dist/*.whl | grep -q "faker_grocery/data/grocery_data.json.gz"

  audit:
    # Known vulnerabilities in the installed dependencies (Faker and its own).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install . pip-audit
      - run: pip-audit --skip-editable
